services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://pipeline:pipeline@postgres:5432/ecommerce
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3000:5173"
    restart: unless-stopped

  airflow:
    image: apache/airflow:2.10.2-python3.11
    profiles: ["orchestration"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://pipeline:pipeline@postgres/ecommerce
      AIRFLOW__CORE__FERNET_KEY: "ZmFrZS1mb3ItZGVtby1vbmx5LW5vdC1zZWNyZXQ="
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas sqlalchemy psycopg2-binary"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./data:/opt/airflow/data
    command: >-
      bash -c "airflow db migrate && airflow users create --username admin
      --password admin --firstname Admin --lastname User --role Admin
      --email admin@example.com || true; airflow scheduler & airflow webserver"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    profiles: ["streaming"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    profiles: ["streaming"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-consumer:
    build: ./kafka
    profiles: ["streaming"]
    depends_on:
      - kafka
      - postgres
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DATABASE_URL: postgresql+psycopg2://pipeline:pipeline@postgres:5432/ecommerce

  spark:
    image: spark:3.5.8-python3
    profiles: ["spark"]
    depends_on:
      - postgres
    volumes:
      - ./spark:/opt/spark-apps
    command: ["bash", "-c", "sleep infinity"]

volumes:
  pgdata:
